name: CI/CD (.NET 10)

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: BLVK.Pickly.Logistics.slnx

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_USERNAME: ${{ secrets.GH_PKG_USERNAME }}
      GITHUB_PAT: ${{ secrets.GH_PKG_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore solution
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Check using directives
        run: dotnet format "${{ env.SOLUTION }}" style --no-restore --verify-no-changes --diagnostics IDE0005

      - name: Build solution (Release)
        run: dotnet build "${{ env.SOLUTION }}" --configuration Release --no-restore

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          if-no-files-found: warn
          path: |
            src/**/bin/Release/**
            tests/**/bin/Release/**

  test-unit:
    needs: build
    runs-on: ubuntu-latest
    env:
      GITHUB_USERNAME: ${{ secrets.GH_PKG_USERNAME }}
      GITHUB_PAT: ${{ secrets.GH_PKG_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Restore solution
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Run Unit Tests with Coverage
        id: unit_tests
        shell: bash
        run: |
          RESULTS_ROOT="TestResultsUnit"
          rm -rf "$RESULTS_ROOT"
          mkdir -p "$RESULTS_ROOT"

          mapfile -t TEST_PROJECTS < <(find tests/unit -type f -iname "*.UnitTests.csproj")
          if [ ${#TEST_PROJECTS[@]} -eq 0 ]; then
            echo "❌ No unit test projects found matching '*.UnitTests.csproj'."
            exit 1
          fi

          echo "🧪 Found ${#TEST_PROJECTS[@]} project(s):"
          printf '%s\n' "${TEST_PROJECTS[@]}"

          for proj in "${TEST_PROJECTS[@]}"; do
            NAME=$(basename "$proj" .csproj)
            OUTDIR="$RESULTS_ROOT/$NAME"
            mkdir -p "$OUTDIR"
            echo "▶️ dotnet test $proj → $OUTDIR"
            dotnet test "$proj" \
              --configuration Release \
              --no-build \
              --results-directory "$OUTDIR" \
              --logger "trx;LogFileName=$NAME-results.trx" \
              --collect "XPlat Code Coverage"
          done

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/*.trx"

      - name: Upload Unit Coverage (Cobertura XML)
        if: ${{ steps.unit_tests.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-raw
          path: "TestResultsUnit/**/coverage.cobertura.xml"

  test-integration:
    needs: build
    runs-on: ubuntu-latest
    env:
      GITHUB_USERNAME: ${{ secrets.GH_PKG_USERNAME }}
      GITHUB_PAT: ${{ secrets.GH_PKG_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'nuget.config') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Restore solution
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Run Integration Tests with Coverage
        id: integration_tests
        shell: bash
        run: |
          RESULTS_ROOT="TestResultsIntegration"
          rm -rf "$RESULTS_ROOT"
          mkdir -p "$RESULTS_ROOT"

          mapfile -t TEST_PROJECTS < <(find tests/integration -type f -iname "*.IntegrationTests.csproj")
          if [ ${#TEST_PROJECTS[@]} -eq 0 ]; then
            echo "❌ No integration test projects found matching '*.IntegrationTests.csproj'."
            exit 1
          fi

          echo "🧪 Found ${#TEST_PROJECTS[@]} project(s):"
          printf '%s\n' "${TEST_PROJECTS[@]}"

          for proj in "${TEST_PROJECTS[@]}"; do
            NAME=$(basename "$proj" .csproj)
            OUTDIR="$RESULTS_ROOT/$NAME"
            mkdir -p "$OUTDIR"
            echo "▶️ dotnet test $proj → $OUTDIR"
            dotnet test "$proj" \
              --configuration Release \
              --no-build \
              --results-directory "$OUTDIR" \
              --logger "trx;LogFileName=$NAME-results.trx" \
              --collect "XPlat Code Coverage"
          done

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: "TestResultsIntegration/**/*.trx"

      - name: Upload Integration Coverage (Cobertura XML)
        if: ${{ steps.integration_tests.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-raw
          path: "TestResultsIntegration/**/coverage.cobertura.xml"

  coverage-report:
    needs: [test-unit, test-integration]
    runs-on: ubuntu-latest

    steps:
      - name: Download Unit Coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit-raw
          path: CoverageRaw/unit

      - name: Download Integration Coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration-raw
          path: CoverageRaw/integration

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        shell: bash
        run: |
          COVERAGE_FILES=$(find CoverageRaw -type f -name "coverage.cobertura.xml")
          if [ -z "$COVERAGE_FILES" ]; then
            echo "No coverage files found under CoverageRaw."
            find CoverageRaw -type f -print || true
            exit 1
          fi

          echo "Generating combined HTML + Cobertura coverage report..."
          REPORTS=$(echo "$COVERAGE_FILES" | tr '\n' ';' | sed 's/;\+$//')
          ~/.dotnet/tools/reportgenerator \
            -reports:"$REPORTS" \
            -targetdir:"CoverageReport" \
            -reporttypes:"HtmlSummary;Cobertura"

      - name: Upload Coverage (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CoverageReport

      - name: Upload Coverage (Cobertura XML)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: CoverageReport/Cobertura.xml

  docker-build-push:
    needs: [test-unit, test-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - service: webapi
            dockerfile: ./src/BLVK.Pickly.Logistics.WebAPI/Dockerfile
            image: blvkpicklylogistics-webapi
          - service: consumer
            dockerfile: ./src/BLVK.Pickly.Logistics.Consumer/Dockerfile
            image: blvkpicklylogistics-consumer
          - service: jobs
            dockerfile: ./src/BLVK.Pickly.Logistics.Jobs/Dockerfile
            image: blvkpicklylogistics-jobs
          - service: migrator
            dockerfile: ./src/BLVK.Pickly.Logistics.DatabaseMigrator/Dockerfile
            image: blvkpicklylogistics-migrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          secrets: |
            GITHUB_USERNAME=${{ secrets.GH_PKG_USERNAME }}
            GITHUB_PAT=${{ secrets.GH_PKG_PAT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: pickly-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.HETZNER_HOST }}
      SSH_USER: ${{ secrets.HETZNER_SSH_USER }}
      SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      SSH_KEY_PASSPHRASE: ${{ secrets.HETZNER_SSH_KEY_PASSPHRASE }}
      SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}

    steps:
      - name: Deploy commit to Hetzner
        shell: bash
        run: |
          set -Eeuo pipefail

          for variable in SSH_HOST SSH_USER SSH_PORT SSH_PRIVATE_KEY SSH_KEY_PASSPHRASE SSH_KNOWN_HOSTS; do
            if [ -z "${!variable:-}" ]; then
              echo "Required production secret $variable is not configured."
              exit 1
            fi
          done

          if [[ ! "$SSH_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]; then
            echo "HETZNER_HOST contains unsupported characters."
            exit 1
          fi

          if [[ ! "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "HETZNER_SSH_USER is not a valid SSH username."
            exit 1
          fi

          if [[ ! "$SSH_PORT" =~ ^[0-9]+$ ]] || (( SSH_PORT < 1 || SSH_PORT > 65535 )); then
            echo "HETZNER_SSH_PORT must be a port number between 1 and 65535."
            exit 1
          fi

          SSH_DIRECTORY="$RUNNER_TEMP/pickly-ssh"
          SSH_KEY_FILE="$SSH_DIRECTORY/deploy-key"
          SSH_ASKPASS_FILE="$SSH_DIRECTORY/askpass"
          KNOWN_HOSTS_FILE="$SSH_DIRECTORY/known_hosts"
          install -m 700 -d "$SSH_DIRECTORY"

          cleanup() {
            if [ -n "${SSH_AGENT_PID:-}" ]; then
              ssh-agent -k >/dev/null 2>&1 || true
            fi

            rm -rf "$SSH_DIRECTORY"
          }
          trap cleanup EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$SSH_KEY_FILE" "$KNOWN_HOSTS_FILE"

          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'printf '\''%s\n'\'' "$SSH_KEY_PASSPHRASE"' \
            > "$SSH_ASKPASS_FILE"
          chmod 700 "$SSH_ASKPASS_FILE"

          eval "$(ssh-agent -s)"
          DISPLAY=:0 \
            SSH_ASKPASS="$SSH_ASKPASS_FILE" \
            SSH_ASKPASS_REQUIRE=force \
            ssh-add "$SSH_KEY_FILE" </dev/null
          unset SSH_PRIVATE_KEY SSH_KEY_PASSPHRASE

          if ! ssh-keygen -F "[$SSH_HOST]:$SSH_PORT" -f "$KNOWN_HOSTS_FILE" >/dev/null; then
            echo "HETZNER_SSH_KNOWN_HOSTS does not contain the configured host and port."
            exit 1
          fi

          ssh \
            -i "$SSH_KEY_FILE" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "${{ github.sha }}" "${{ github.run_id }}" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          revision="$1"
          run_id="$2"
          deployment_directory=/opt/pickly

          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The requested image revision is not a full Git commit SHA."
            exit 1
          fi

          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "The GitHub Actions run ID is invalid."
            exit 1
          fi

          cd "$deployment_directory"

          for required_file in compose.yml .env app.env; do
            if [ ! -f "$required_file" ]; then
              echo "Required deployment file $deployment_directory/$required_file is missing."
              exit 1
            fi
          done

          if ! docker info >/dev/null 2>&1; then
            echo "The deployment user cannot access Docker non-interactively."
            exit 1
          fi

          exec 9>"$deployment_directory/.deployment.lock"
          if ! flock -w 300 9; then
            echo "Timed out waiting for the production deployment lock."
            exit 1
          fi

          latest_run_file="$deployment_directory/.latest-deployment-run-id"
          latest_run_id=0
          if [ -f "$latest_run_file" ]; then
            latest_run_id="$(tr -d '[:space:]' < "$latest_run_file")"
            if [[ ! "$latest_run_id" =~ ^[0-9]+$ ]]; then
              echo "The stored deployment run ID is invalid."
              exit 1
            fi
          fi

          if (( run_id < latest_run_id )); then
            echo "Skipping superseded workflow run $run_id; run $latest_run_id already reached the server."
            exit 0
          fi

          printf '%s\n' "$run_id" > "$latest_run_file.tmp"
          mv "$latest_run_file.tmp" "$latest_run_file"

          compose() {
            PICKLY_VERSION="$revision" docker compose \
              --env-file "$deployment_directory/.env" \
              --env-file "$deployment_directory/app.env" \
              --file "$deployment_directory/compose.yml" \
              "$@"
          }

          echo "Validating production Compose configuration."
          compose config --quiet

          available_services="$(compose config --services)"
          for service in postgres database-migrator webapi consumer jobs; do
            if ! grep -Fxq "$service" <<< "$available_services"; then
              echo "Required Compose service '$service' is missing."
              exit 1
            fi
          done

          wait_for_health() {
            local timeout_seconds="$1"
            shift
            local deadline=$((SECONDS + timeout_seconds))
            local service container_id status all_healthy

            while (( SECONDS < deadline )); do
              all_healthy=true

              for service in "$@"; do
                container_id="$(compose ps -q "$service")"
                if [ -z "$container_id" ]; then
                  all_healthy=false
                  continue
                fi

                status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_id")"
                case "$status" in
                  healthy)
                    ;;
                  unhealthy)
                    echo "Service '$service' reported an unhealthy status."
                    return 1
                    ;;
                  *)
                    all_healthy=false
                    ;;
                esac
              done

              if [ "$all_healthy" = true ]; then
                return 0
              fi

              sleep 5
            done

            echo "Timed out waiting for services to become healthy: $*"
            return 1
          }

          echo "Pulling application images for commit $revision."
          compose pull database-migrator webapi consumer jobs

          echo "Verifying PostgreSQL health without recreating it."
          if ! wait_for_health 120 postgres; then
            compose ps postgres
            exit 1
          fi

          echo "Running database migrations."
          compose up -d --no-deps --force-recreate database-migrator
          if ! wait_for_health 600 database-migrator; then
            compose ps database-migrator
            compose stop database-migrator || true
            compose rm -f database-migrator || true
            exit 1
          fi

          compose stop database-migrator
          compose rm -f database-migrator

          echo "Updating application services."
          compose up -d --no-deps --force-recreate webapi consumer jobs
          if ! wait_for_health 300 webapi consumer jobs; then
            compose ps webapi consumer jobs
            exit 1
          fi

          deployed_version_file="$deployment_directory/.deployed-version"
          if [ -f "$deployed_version_file" ]; then
            cp "$deployed_version_file" "$deployment_directory/.previous-deployed-version"
          fi

          printf '%s\n' "$revision" > "$deployed_version_file.tmp"
          mv "$deployed_version_file.tmp" "$deployed_version_file"

          echo "Successfully deployed commit $revision."
          compose ps webapi consumer jobs postgres
          REMOTE_SCRIPT
